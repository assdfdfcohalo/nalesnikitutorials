<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>mObywatel - Dostęp</title>
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #1f2125;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666b72;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 15px;
        }
        input:focus {
            border-color: #014A93;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #014A93;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .success {
            color: green;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hasło</h1>
        <input type="text" id="codeInput" maxlength="6" placeholder=" " autocomplete="off" />
        <button id="submitBtn" onclick="checkCode()">Wejdź</button>
        <p class="error" id="errorMsg">Zły kod</p>
        <p class="success" id="successMsg">Kod poprawny!</p>
    </div>

    <script>
        var BIN_ID = "6a1c75d6ddf5aa59f77c7bbc";
        var API_KEY = "$2a$10$6NW2TwStv0/QnZnCkT.vWure/.Dzc/9y0eTqw1WNdHMZ./BjnD346";
        var BASE_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;

        function checkCode() {
            var code = document.getElementById("codeInput").value.trim();
            if (!code) return;

            var btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.textContent = "Sprawdzanie...";
            document.getElementById("errorMsg").style.display = "none";

            fetch(BASE_URL + "/latest", {
                headers: { "X-Master-Key": API_KEY }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var codes = data.record.codes;
                var found = false;
                for (var i = 0; i < codes.length; i++) {
                    if (codes[i].code === code && !codes[i].used) {
                        found = true;
                        codes[i].used = true;
                        break;
                    }
                }
                if (!found) {
                    document.getElementById("errorMsg").style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Wejdź";
                    return;
                }
                return fetch(BASE_URL, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify({ codes: codes })
                });
            })
            .then(function(r) {
                if (!r) return;
                sessionStorage.setItem("authenticated", "true");
                document.getElementById("successMsg").style.display = "block";
                setTimeout(function() {
                    location.href = "/nalesnikitutorials/index.html";
                }, 1000);
            })
            .catch(function() {
                document.getElementById("errorMsg").style.display = "block";
                btn.disabled = false;
                btn.textContent = "Wejdź";
            });
        }

        document.getElementById("codeInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") checkCode();
        });
    </script>
</body>
</html>
